<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <a th:href="@{/organizador/ediciones}" class="btn btn-sm btn-outline-gold mb-3"><i class="bi bi-arrow-left"></i> Ediciones</a>

    <div class="page-header fade-up">
        <div>
            <h1 class="page-title"><i class="bi bi-tags-fill"></i> Categorías · <span th:text="${edicion.nombre}">Edición</span></h1>
            <p class="page-sub">
                <span th:replace="~{fragments/layout :: estadoEdicion(${edicion.estado})}"></span>
                <span class="ms-2" th:unless="${edicion.estado == 'BORRADOR' or edicion.estado == 'NOMINACION'}">
                    Solo se pueden crear o eliminar categorías en Borrador o Nominación.
                </span>
            </p>
        </div>
        <button type="button" class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalCategoria"
                th:if="${edicion.estado == 'BORRADOR' or edicion.estado == 'NOMINACION'}">
            <i class="bi bi-plus-lg"></i> Nueva categoría
        </button>
    </div>

    <div class="glass p-5 text-center text-secondary" th:if="${#lists.isEmpty(categorias)}">
        Esta edición aún no tiene categorías (por ejemplo: Balón de Oro, Mejor Portero, Mejor Jugador Joven).
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4 fade-up" th:each="c : ${categorias}">
            <div class="glass p-4 h-100 lift d-flex flex-column">
                <div class="role-icon"><i class="bi bi-award-fill"></i></div>
                <h5 th:text="${c.nombre}">Categoría</h5>
                <p class="text-secondary flex-grow-1" th:text="${c.descripcion}">Descripción</p>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-gold" data-bs-toggle="modal" data-bs-target="#modalCategoria"
                            th:attr="data-id=${c.id},data-nombre=${c.nombre},data-descripcion=${c.descripcion}">
                        <i class="bi bi-pencil-fill"></i> Editar
                    </button>
                    <form th:if="${edicion.estado == 'BORRADOR' or edicion.estado == 'NOMINACION'}"
                          th:action="@{/organizador/categorias/{id}/eliminar(id=${c.id})}" method="post"
                          onsubmit="return confirm('Se eliminarán también sus nominaciones y votos. ¿Continuar?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash-fill"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal crear / editar -->
<div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true"
     data-ga-form data-titulo-nuevo="Nueva categoría" data-titulo-editar="Editar categoría">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/organizador/categorias/guardar}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="modal-title-text">Nueva categoría</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <input type="hidden" name="edicionId" th:value="${edicion.id}" data-keep>
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" name="descripcion">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-gold">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
