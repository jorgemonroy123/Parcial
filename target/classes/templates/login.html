<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container login-wrap">
    <div class="glass login-card fade-up">
        <div class="text-center mb-4">
            <i class="bi bi-trophy-fill text-gold fs-1"></i>
            <h2 class="mt-2 mb-1">Bienvenido</h2>
            <p class="text-secondary mb-0">Ingresa para participar en <span th:text="${plataforma}">Golden Awards</span></p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger ga-alert">
            <i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos (o cuenta inactiva).
        </div>
        <div th:if="${param.logout}" class="alert alert-success ga-alert">
            <i class="bi bi-check-circle-fill"></i> Cerraste sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-gold btn-lg w-100">Entrar</button>
        </form>

        <hr class="my-4">
        <p class="small text-secondary mb-2"><i class="bi bi-lightning-charge-fill text-gold"></i> Cuentas de prueba (clic para rellenar):</p>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="demo-chip" data-demo-user="admin" data-demo-pass="admin123">Administrador</button>
            <button type="button" class="demo-chip" data-demo-user="organizador" data-demo-pass="organizador123">Organizador</button>
            <button type="button" class="demo-chip" data-demo-user="votante" data-demo-pass="votante123">Votante</button>
            <button type="button" class="demo-chip" data-demo-user="nominado" data-demo-pass="nominado123">Nominado</button>
            <button type="button" class="demo-chip" data-demo-user="jurado" data-demo-pass="jurado123">Jurado</button>
            <button type="button" class="demo-chip" data-demo-user="publico" data-demo-pass="publico123">Público</button>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
