<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo de nominados')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="page-header fade-up">
        <div>
            <h1 class="page-title"><i class="bi bi-search"></i> Catálogo de nominados</h1>
            <p class="page-sub">Explora nominaciones con filtros por edición, categoría, estado y búsqueda libre.</p>
        </div>
    </div>

    <form method="get" th:action="@{/publico/catalogo}" class="glass p-4 mb-4 fade-up">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Edición</label>
                <select name="edicionId" class="form-select" onchange="this.form.submit()">
                    <option value="">Todas</option>
                    <option th:each="e : ${ediciones}" th:value="${e.id}" th:text="${e.nombre}"
                            th:selected="${e.id == edicionId}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Categoría</label>
                <select name="categoriaId" class="form-select">
                    <option value="">Todas</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                            th:selected="${c.id == categoriaId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select">
                    <option value="">Todos</option>
                    <option value="PENDIENTE" th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
                    <option value="APROBADA" th:selected="${estado == 'APROBADA'}">Aprobada</option>
                    <option value="RECHAZADA" th:selected="${estado == 'RECHAZADA'}">Rechazada</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Orden</label>
                <select name="orden" class="form-select">
                    <option value="nombre" th:selected="${orden == 'nombre'}">A-Z nombre</option>
                    <option value="equipo" th:selected="${orden == 'equipo'}">Equipo</option>
                    <option value="estado" th:selected="${orden == 'estado'}">Estado</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Buscar</label>
                <input type="text" name="q" class="form-control" placeholder="Nombre, equipo..." th:value="${q}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-gold"><i class="bi bi-funnel"></i> Filtrar</button>
                <a th:href="@{/publico/catalogo}" class="btn btn-outline-light btn-sm ms-2">Limpiar</a>
            </div>
        </div>
    </form>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="f : ${filas}">
            <div class="glass p-3 h-100 lift">
                <div class="d-flex justify-content-between">
                    <h5 class="mb-1 text-gold" th:text="${f.jugador.nombre}">Nombre</h5>
                    <span th:replace="~{fragments/layout :: estadoNominacion(${f.nominacion.estado})}"></span>
                </div>
                <p class="mb-1 small text-secondary">
                    <span th:text="${f.jugador.equipo}">Equipo</span> ·
                    <span th:text="${f.jugador.posicion}">Pos</span> ·
                    <span th:text="${f.jugador.pais}">País</span>
                </p>
                <p class="small mb-2">
                    <span class="badge bg-secondary" th:text="${f.categoriaNombre}"></span>
                    <span class="badge bg-dark" th:text="${f.edicionNombre}"></span>
                </p>
                <p class="small text-muted" th:if="${f.jugador.biografia != null}" th:text="${#strings.abbreviate(f.jugador.biografia, 120)}"></p>
            </div>
        </div>
    </div>
    <div class="glass p-5 text-center text-secondary" th:if="${#lists.isEmpty(filas)}">
        <i class="bi bi-inbox fs-1"></i>
        <p class="mt-2 mb-0">No hay nominados con esos filtros.</p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
