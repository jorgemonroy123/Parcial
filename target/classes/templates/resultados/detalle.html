<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ranking')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <a th:href="@{/resultados}" class="btn btn-sm btn-outline-gold mb-3"><i class="bi bi-arrow-left"></i> Resultados</a>

    <div class="page-header fade-up">
        <div>
            <h1 class="page-title"><i class="bi bi-trophy-fill"></i> <span th:text="${edicion.nombre}">Edición</span></h1>
            <p class="page-sub">
                <span th:replace="~{fragments/layout :: estadoEdicion(${edicion.estado})}"></span>
                <span class="ms-2" th:unless="${edicion.resultadosPublicados}">Conteo no oficial (resultados sin publicar)</span>
            </p>
        </div>
    </div>

    <!-- Estadisticas -->
    <div class="row g-3 mb-4 fade-up">
        <div class="col-6 col-lg-3"><div class="glass stat-tile"><div class="num" th:text="${resumen['totalVotos']}">0</div><div class="small text-secondary">Votos emitidos</div></div></div>
        <div class="col-6 col-lg-3"><div class="glass stat-tile"><div class="num" th:text="${resumen['votantes']}">0</div><div class="small text-secondary">Votantes participantes</div></div></div>
        <div class="col-6 col-lg-3"><div class="glass stat-tile"><div class="num"><span th:text="${resumen['participacion']}">0</span>%</div><div class="small text-secondary">Participación</div></div></div>
        <div class="col-6 col-lg-3"><div class="glass stat-tile"><div class="num" th:text="${resumen['nominados']}">0</div><div class="small text-secondary">Nominados aprobados</div></div></div>
    </div>

    <div class="glass p-5 text-center text-secondary" th:if="${#lists.isEmpty(categorias)}">Esta edición no tiene categorías.</div>

    <!-- Ranking por categoria -->
    <section class="mb-4 fade-up" th:each="cat : ${categorias}">
        <div class="d-flex justify-content-between align-items-end mb-2">
            <h4 class="mb-0"><i class="bi bi-award-fill text-gold"></i> <span th:text="${cat['nombre']}">Categoría</span></h4>
            <span class="small text-secondary"><span th:text="${cat['totalVotos']}">0</span> voto(s)</span>
        </div>

        <div class="rank-row" th:each="fila : ${cat['ranking']}"
             th:classappend="${fila['posicion'] == 1 and cat['totalVotos'] > 0} ? 'ganador'">
            <div class="rank-pos">
                <i th:if="${fila['posicion'] == 1 and cat['totalVotos'] > 0}" class="bi bi-trophy-fill"></i>
                <span th:unless="${fila['posicion'] == 1 and cat['totalVotos'] > 0}" th:text="${fila['posicion']}">2</span>
            </div>
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between">
                    <div>
                        <span class="fw-semibold" th:text="${fila['nombre']}">Jugador</span>
                        <span class="small text-secondary ms-1" th:text="${fila['equipo']}">Equipo</span>
                    </div>
                    <div><strong class="text-gold" th:text="${fila['votos']}">0</strong> <span class="small text-secondary">(<span th:text="${fila['porcentaje']}">0</span>%)</span></div>
                </div>
                <div class="rank-bar mt-2"><span th:style="'width:' + ${fila['porcentaje']} + '%'"></span></div>
            </div>
        </div>
        <p class="text-secondary small" th:if="${#lists.isEmpty(cat['ranking'])}">Sin nominados aprobados.</p>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
