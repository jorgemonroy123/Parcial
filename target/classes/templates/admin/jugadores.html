<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Jugadores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="page-header fade-up">
        <div>
            <h1 class="page-title"><i class="bi bi-person-badge-fill"></i> Jugadores</h1>
            <p class="page-sub">Catálogo de jugadores que pueden ser nominados.</p>
        </div>
        <button type="button" class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalJugador">
            <i class="bi bi-plus-lg"></i> Nuevo jugador
        </button>
    </div>

    <div class="glass overflow-hidden fade-up">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr><th>Jugador</th><th>Equipo</th><th>Posición</th><th>País</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="j : ${jugadores}">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(j.nombre, 0, 1))}">J</span>
                            <span class="fw-semibold" th:text="${j.nombre}">Nombre</span>
                        </div>
                    </td>
                    <td th:text="${j.equipo}">Equipo</td>
                    <td><span class="badge rounded-pill role-pill" th:text="${j.posicion}">Posicion</span></td>
                    <td th:text="${j.pais}">Pais</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-gold" data-bs-toggle="modal" data-bs-target="#modalJugador"
                                th:attr="data-id=${j.id},data-nombre=${j.nombre},data-equipo=${j.equipo},data-posicion=${j.posicion},data-pais=${j.pais}">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <form th:action="@{/admin/jugadores/{id}/eliminar(id=${j.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este jugador?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash-fill"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(jugadores)}">
                    <td colspan="5" class="text-center text-secondary py-4">Aún no hay jugadores registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal crear / editar -->
<div class="modal fade" id="modalJugador" tabindex="-1" aria-hidden="true"
     data-ga-form data-titulo-nuevo="Nuevo jugador" data-titulo-editar="Editar jugador">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/jugadores/guardar}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="modal-title-text">Nuevo jugador</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Equipo</label>
                        <input type="text" class="form-control" name="equipo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Posición</label>
                        <input type="text" class="form-control" name="posicion" list="posiciones" required>
                        <datalist id="posiciones">
                            <option value="Portero"></option>
                            <option value="Defensa"></option>
                            <option value="Mediocampista"></option>
                            <option value="Delantero"></option>
                        </datalist>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">País</label>
                        <input type="text" class="form-control" name="pais" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-gold">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
