<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Feedback')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="page-header">
        <h1 class="page-title"><i class="bi bi-star"></i> Encuesta de satisfacción</h1>
        <p class="page-sub">Evalúa la organización del premio. No necesitas cuenta de votante.</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <form method="post" th:action="@{/publico/feedback}" class="glass p-4">
                <div class="mb-3">
                    <label class="form-label">Edición</label>
                    <select name="edicionId" class="form-select" required>
                        <option value="">Selecciona...</option>
                        <option th:each="e : ${ediciones}" th:value="${e.id}" th:text="${e.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Calificación (estrellas)</label>
                    <select name="estrellas" class="form-select" required>
                        <option value="5">★★★★★ Excelente</option>
                        <option value="4">★★★★☆ Muy bueno</option>
                        <option value="3">★★★☆☆ Bueno</option>
                        <option value="2">★★☆☆☆ Regular</option>
                        <option value="1">★☆☆☆☆ Mejorable</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tu nombre (opcional)</label>
                    <input type="text" name="autorNombre" class="form-control" placeholder="Anónimo">
                </div>
                <div class="mb-3">
                    <label class="form-label">Comentario</label>
                    <textarea name="comentario" class="form-control" rows="3" placeholder="¿Qué te pareció la organización?"></textarea>
                </div>
                <button type="submit" class="btn btn-gold w-100">Enviar opinión</button>
            </form>
        </div>
        <div class="col-lg-7">
            <div class="glass p-4">
                <h5 class="mb-3">Opiniones recientes</h5>
                <div th:each="f : ${feedbacks}" class="border-bottom border-secondary py-2">
                    <div class="d-flex justify-content-between">
                        <strong th:text="${f.autorNombre}">Anónimo</strong>
                        <span class="text-gold" th:text="${#strings.repeat('★', f.estrellas)} + ${#strings.repeat('☆', 5 - f.estrellas)}"></span>
                    </div>
                    <small class="text-secondary" th:text="${f.edicionNombre}"></small>
                    <p class="mb-0 small" th:text="${f.comentario}"></p>
                </div>
                <p th:if="${#lists.isEmpty(feedbacks)}" class="text-secondary mb-0">Aún no hay comentarios.</p>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
