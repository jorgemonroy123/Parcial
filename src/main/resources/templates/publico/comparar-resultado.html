<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Resultado comparación')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
    <div class="page-header">
        <h1 class="page-title"><i class="bi bi-columns-gap"></i> Comparación
            <span class="text-gold" th:if="${categoria}" th:text="'· ' + ${categoria.nombre}"></span>
        </h1>
        <a th:href="@{/publico/comparar}" class="btn btn-outline-light btn-sm">Nueva comparación</a>
    </div>
    <div class="row g-3">
        <div class="col-md-4" th:each="j : ${jugadores}">
            <div class="glass p-4 h-100">
                <h4 class="text-gold" th:text="${j.nombre}">Nombre</h4>
                <p class="small text-secondary mb-3">
                    <span th:text="${j.equipo}"></span> · <span th:text="${j.posicion}"></span> · <span th:text="${j.pais}"></span>
                </p>
                <p th:if="${j.biografia}" class="small" th:text="${j.biografia}"></p>
                <table class="table table-sm table-dark table-borderless mb-0">
                    <tr><td>Goles</td><td class="text-end fw-bold" th:text="${j.goles != null ? j.goles : '—'}">0</td></tr>
                    <tr><td>Asistencias</td><td class="text-end fw-bold" th:text="${j.asistencias != null ? j.asistencias : '—'}">0</td></tr>
                    <tr><td>Partidos</td><td class="text-end fw-bold" th:text="${j.partidos != null ? j.partidos : '—'}">0</td></tr>
                    <tr><td>Trofeos</td><td class="text-end fw-bold" th:text="${j.trofeos != null ? j.trofeos : '—'}">0</td></tr>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
