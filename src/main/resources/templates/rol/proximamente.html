<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Próximamente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="glass p-5 text-center fade-up" style="max-width: 560px;">
        <i class="bi text-gold" th:classappend="${icono}" style="font-size: 3.5rem;"></i>
        <h1 class="mt-3 mb-1" th:text="${rolNombre}">Rol</h1>
        <span class="badge rounded-pill role-pill mb-3">Módulo del Sprint 2</span>
        <p class="text-secondary mb-4" th:text="${funcion}">Función exclusiva del rol.</p>
        <a th:href="@{/panel}" class="btn btn-gold"><i class="bi bi-house-fill"></i> Volver al panel</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
