<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Parámetros')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="page-header fade-up">
        <div>
            <h1 class="page-title"><i class="bi bi-sliders"></i> Parámetros globales</h1>
            <p class="page-sub">
                Configuración de la plataforma. <code>nombre_plataforma</code> y <code>lema</code> se muestran en toda la interfaz.
            </p>
        </div>
        <button type="button" class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalParametro">
            <i class="bi bi-plus-lg"></i> Nuevo parámetro
        </button>
    </div>

    <div class="glass overflow-hidden fade-up">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr><th>Clave</th><th>Valor</th><th>Descripción</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${parametros}">
                    <td><code th:text="${p.clave}">clave</code></td>
                    <td class="fw-semibold" th:text="${p.valor}">valor</td>
                    <td class="text-secondary" th:text="${p.descripcion}">descripcion</td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-gold" data-bs-toggle="modal" data-bs-target="#modalParametro"
                                th:attr="data-id=${p.id},data-clave=${p.clave},data-valor=${p.valor},data-descripcion=${p.descripcion}">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <form th:action="@{/admin/parametros/{id}/eliminar(id=${p.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este parámetro?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash-fill"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(parametros)}">
                    <td colspan="4" class="text-center text-secondary py-4">No hay parámetros configurados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal crear / editar -->
<div class="modal fade" id="modalParametro" tabindex="-1" aria-hidden="true"
     data-ga-form data-titulo-nuevo="Nuevo parámetro" data-titulo-editar="Editar parámetro">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/parametros/guardar}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="modal-title-text">Nuevo parámetro</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <div class="mb-3">
                        <label class="form-label">Clave</label>
                        <input type="text" class="form-control" name="clave" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Valor</label>
                        <input type="text" class="form-control" name="valor" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" name="descripcion">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-gold">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
