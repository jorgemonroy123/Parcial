<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="page-header fade-up">
        <div>
            <h1 class="page-title"><i class="bi bi-people-fill"></i> Usuarios</h1>
            <p class="page-sub">Crea cuentas, asigna roles y activa o desactiva el acceso.</p>
        </div>
        <button type="button" class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalUsuario">
            <i class="bi bi-plus-lg"></i> Nuevo usuario
        </button>
    </div>

    <div class="glass overflow-hidden fade-up">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr><th>Usuario</th><th>Rol</th><th>Jugador asociado</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(u.nombre, 0, 1))}">U</span>
                            <div>
                                <div class="fw-semibold" th:text="${u.nombre}">Nombre</div>
                                <div class="small text-secondary">@<span th:text="${u.username}">usuario</span></div>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge rounded-pill role-pill" th:text="${u.rol}">ROL</span></td>
                    <td>
                        <span th:if="${u.jugadorId != null and jugadoresPorId[u.jugadorId] != null}"
                              th:text="${jugadoresPorId[u.jugadorId].nombre}">Jugador</span>
                        <span th:if="${u.jugadorId == null}" class="text-secondary">—</span>
                    </td>
                    <td>
                        <span th:if="${u.activo}" class="badge rounded-pill estado-aprobada badge-estado">Activo</span>
                        <span th:unless="${u.activo}" class="badge rounded-pill estado-rechazada badge-estado">Inactivo</span>
                    </td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline-gold" data-bs-toggle="modal" data-bs-target="#modalUsuario"
                                th:attr="data-id=${u.id},data-nombre=${u.nombre},data-username=${u.username},data-rol=${u.rol},data-jugador-id=${u.jugadorId},data-activo=${u.activo}">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <form th:action="@{/admin/usuarios/{id}/eliminar(id=${u.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este usuario?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash-fill"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal crear / editar -->
<div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true"
     data-ga-form data-titulo-nuevo="Nuevo usuario" data-titulo-editar="Editar usuario">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/usuarios/guardar}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title"><span class="modal-title-text">Nuevo usuario</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre de usuario</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="password" autocomplete="new-password">
                        <div class="form-text pw-ayuda" style="display:none;">Déjala en blanco para conservar la actual.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select class="form-select" name="rol" data-defecto="VOTANTE" required>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROL</option>
                        </select>
                    </div>
                    <div class="mb-3" id="campoJugador" style="display:none;">
                        <label class="form-label">Jugador asociado</label>
                        <select class="form-select" name="jugadorId">
                            <option value="">— Selecciona —</option>
                            <option th:each="j : ${jugadores}" th:value="${j.id}" th:text="${j.nombre + ' (' + j.equipo + ')'}">Jugador</option>
                        </select>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="activo" id="chkActivo" data-defecto="true">
                        <label class="form-check-label" for="chkActivo">Cuenta activa</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-gold">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
